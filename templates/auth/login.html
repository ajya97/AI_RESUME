{% extends "public_base.html" %}
{% block title %}Sign in — ResumeAI{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card auth-card">
  <h1>Welcome back</h1><p class="sub">Sign in to your career copilot.</p>
  <form method="post" action="{{ url_for('auth.login') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required value="{{ form.get('email','') }}"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <div class="field row row-between"><label class="checkbox"><input type="checkbox" name="remember"> Remember me</label><a href="{{ url_for('auth.forgot_password') }}" class="small">Forgot password?</a></div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
  </form>
  <p class="foot">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div></div>
{% endblock %}
