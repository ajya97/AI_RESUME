{% extends "public_base.html" %}
{% block title %}Choose a new password — ResumeAI{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card auth-card">
  <h1>Choose a new password</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" required><div class="pw-rules">At least 8 characters, with a letter and a number.</div></div>
    <div class="field"><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div>
    <button class="btn btn-primary btn-block" type="submit">Update password</button>
  </form>
</div></div>
{% endblock %}
