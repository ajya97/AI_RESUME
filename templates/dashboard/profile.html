{% extends "app_base.html" %}
{% block title %}Profile — ResumeAI{% endblock %}
{% block crumb %}Profile{% endblock %}
{% block content %}
<div class="page-head"><h1>Profile</h1></div>
<div class="grid grid-2">
  <div class="card"><h3>Your details</h3>
    <form method="post" action="{{ url_for('account.profile') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="full_name">Full name</label><input id="full_name" name="full_name" type="text" maxlength="120" value="{{ current_user.full_name }}" required></div>
      <div class="field"><label>Email</label><input type="email" value="{{ current_user.email }}" disabled></div>
      <button class="btn btn-primary" type="submit">Save</button></form></div>
  <div class="card"><h3>Change password</h3>
    <form method="post" action="{{ url_for('account.change_password') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="cp">Current password</label><input id="cp" name="current_password" type="password" autocomplete="current-password" required></div>
      <div class="field"><label for="np">New password</label><input id="np" name="new_password" type="password" autocomplete="new-password" required></div>
      <div class="field"><label for="cf">Confirm new password</label><input id="cf" name="confirm_password" type="password" autocomplete="new-password" required></div>
      <button class="btn btn-primary" type="submit">Update password</button></form></div>
</div>
{% endblock %}
